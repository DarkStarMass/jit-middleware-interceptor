[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmi-interceptor"
version = "2.0.0"
description = "JIT Middleware Interceptor (JMI-v2.0) — The Invisible Router. Zero-entropy, just-in-time tool dispatch for ephemeral LLM pipelines."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "★DarkStarMass★" },
    { name = "Vega" },
]
keywords = [
    "llm",
    "middleware",
    "just-in-time",
    "tool-calling",
    "zero-entropy",
    "edge",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/DarkStarMass/jit-middleware-interceptor"
Repository = "https://github.com/DarkStarMass/jit-middleware-interceptor"
Issues = "https://github.com/DarkStarMass/jit-middleware-interceptor/issues"
Credits = "https://github.com/DarkStarMass/jit-middleware-interceptor/blob/main/CREDITS.md"

[project.optional-dependencies]
dev = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jmi = ["py.typed"]
